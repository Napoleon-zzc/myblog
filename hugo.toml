baseURL = "https://myblog-3v5.pages.dev/"
#languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "我的博客"
theme = "PaperMod"

[params]
  author = "ZZC"
  description = "个人博客"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.homeInfoParams]
    Title = "你好"
    Content = "欢迎来到我的博客"

[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "全部文章"
    url = "/posts/"
    weight = 20
  [[menu.main]]
    name = "笔记"    
    url = "/categories/笔记/" 
    weight = 30
  [[menu.main]]
    name = "科研"
    url = "/categories/论文/"
    weight = 40

# 允许正文中的原始 HTML 原样输出（<p align="center"><img ...></p> 这类居中图片需要）
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[languages]
  [languages.zh-cn]
    label = "中文"
    weight = 1
    [languages.zh-cn.params]
      languageDirection = "ltr"